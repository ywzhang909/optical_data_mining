name: CI

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify imports
        run: |
          python -c "from data_mining.input_sources import KafkaInput, RabbitMQInput, FileSystemInput, ZipInput; print('input_sources OK')"
          python -c "import sys; sys.path.insert(0, 'ui'); from analysis.optical_analysis import BeamAnalysisMetrics; print('analysis OK')"
