# 可配置工作流模板（YAML）
source:
  # tiff_dir | numpy_files
  type: tiff_dir
  path: ./data/002/digitaloptical4Floor/光瞳image
  pattern: "*.TIFF"

steps:
  - name: d4sigma
    input: image
    output: moments

  - name: uniformity
    input: image
    params:
      center: ["$moments.center_x", "$moments.center_y"]

  - name: radius
    input: image
    params:
      center: ["$moments.center_x", "$moments.center_y"]
      energy: 0.9

  - name: ellipse_fit
    input: image
