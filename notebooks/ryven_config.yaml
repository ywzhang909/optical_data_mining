# Ryven 激光光束分析配置文件

# Ryven GUI 设置
ryven:
  # GUI 主题设置
  theme:
    name: "light"  # 可选: "light", "dark"
    primary_color: "#45B7D1"
    secondary_color: "#4ECDC4"
    accent_color: "#FF6B6B"
  
  # 节点布局设置
  node_layout:
    grid_size: 100
    snap_to_grid: true
    auto_arrange: true
  
  # 画布设置
  canvas:
    background_color: "#FAFAFA"
    grid_visible: true
    grid_size: 20

# 数据处理设置
data_processing:
  # 图像读取设置
  image:
    supported_formats: [".TIFF", ".TIF", ".tiff", ".tif"]
    default_pattern: "*.TIFF"
    max_image_size: [2048, 2048]  # 最大图像尺寸 (width, height)
  
  # 预处理参数
  preprocessing:
    background_method: "median"  # 可选: "median", "min"
    kernel_size: 21
    sigma_factor: 3.0
    preserve_energy: true
  
  # 特征提取设置
  feature_extraction:
    enable_d4sigma: true
    enable_ellipse: true
    enable_gaussian: false
    enable_zernike: false
    pixel_size_um: 1.0
  
  # 质量分析参数
  quality_analysis:
    focal_length_mm: 100.0
    wavelength_nm: 1064.0
    beam_expansion_ratio: 1.0
    enable_strehl: true
    enable_bpp: true

# 节点工作流配置
workflows:
  # 简单分析工作流
  simple_analysis:
    nodes:
      - name: "image_input"
        position: [100, 100]
        params:
          directory: "${data_dir}"
          file_pattern: "*.TIFF"
          process_images: true
      
      - name: "preprocessing"
        position: [300, 100]
        params:
          background_method: "median"
          kernel_size: 21
          sigma_factor: 3.0
      
      - name: "feature_extraction"
        position: [500, 100]
        params:
          extract_d4sigma: true
          extract_ellipse: true
          extract_gaussian: false
      
      - name: "visualization"
        position: [700, 100]
        params:
          plot_type: "time_series"
          features: "all"
      
      - name: "data_export"
        position: [900, 100]
        params:
          export_path: "results/analysis_results.parquet"
          export_format: "parquet"
    
    connections:
      - from: "image_input"
        to: "preprocessing"
        output: "beam_data"
        input: "beam_data"
      
      - from: "preprocessing"
        to: "feature_extraction"
        output: "processed_data"
        input: "beam_data"
      
      - from: "feature_extraction"
        to: "visualization"
        output: "features_data"
        input: "data"
      
      - from: "visualization"
        to: "data_export"
        output: "plot_figure"
        input: "data"
  
  # 高级分析工作流
  advanced_analysis:
    nodes:
      - name: "pupil_image_input"
        position: [100, 100]
        params:
          directory: "${pupil_data_dir}"
          file_pattern: "*光瞳*.TIFF"
          process_images: true
      
      - name: "axis_image_input"
        position: [100, 300]
        params:
          directory: "${axis_data_dir}"
          file_pattern: "*光轴*.TIFF"
          process_images: true
      
      - name: "preprocessing_pupil"
        position: [300, 100]
        params:
          background_method: "median"
          kernel_size: 21
          sigma_factor: 3.0
      
      - name: "preprocessing_axis"
        position: [300, 300]
        params:
          background_method: "median"
          kernel_size: 21
          sigma_factor: 3.0
      
      - name: "feature_extraction_pupil"
        position: [500, 100]
        params:
          extract_d4sigma: true
          extract_ellipse: true
          extract_gaussian: true
      
      - name: "feature_extraction_axis"
        position: [500, 300]
        params:
          extract_d4sigma: true
          extract_ellipse: true
          extract_gaussian: true
      
      - name: "beam_quality"
        position: [700, 200]
        params:
          focal_length_mm: 100.0
          wavelength_nm: 1064.0
      
      - name: "visualization_advanced"
        position: [900, 200]
        params:
          plot_type: "comprehensive"
          features: "all"
      
      - name: "data_export_advanced"
        position: [1100, 200]
        params:
          export_path: "results/advanced_analysis_results.parquet"
          export_format: "parquet"
    
    connections:
      - from: "pupil_image_input"
        to: "preprocessing_pupil"
        output: "beam_data"
        input: "beam_data"
      
      - from: "axis_image_input"
        to: "preprocessing_axis"
        output: "beam_data"
        input: "beam_data"
      
      - from: "preprocessing_pupil"
        to: "feature_extraction_pupil"
        output: "processed_data"
        input: "beam_data"
      
      - from: "preprocessing_axis"
        to: "feature_extraction_axis"
        output: "processed_data"
        input: "beam_data"
      
      - from: "feature_extraction_pupil"
        to: "beam_quality"
        output: "features_data"
        input: "pupil_data"
      
      - from: "feature_extraction_axis"
        to: "beam_quality"
        output: "features_data"
        input: "axis_data"
      
      - from: "beam_quality"
        to: "visualization_advanced"
        output: "quality_results"
        input: "data"
      
      - from: "visualization_advanced"
        to: "data_export_advanced"
        output: "plot_figure"
        input: "data"

# 可视化设置
visualization:
  # 默认图表设置
  plots:
    time_series:
      figure_size: [12, 8]
      dpi: 100
      style: "seaborn-v0_8"
      
    scatter_matrix:
      figure_size: [10, 10]
      alpha: 0.6
      diagonal: "hist"
      
    correlation_heatmap:
      figure_size: [8, 6]
      cmap: "RdYlBu_r"
      annot: true
  
  # 颜色主题
  color_schemes:
    default: ["#FF6B6B", "#4ECDC4", "#45B7D1", "#F7DC6F", "#BB8FCE", "#85C1E9"]
    professional: ["#2E86AB", "#A23B72", "#F18F01", "#C73E1D", "#592E83", "#045275"]
    modern: ["#6C5CE7", "#74B9FF", "#00B894", "#FDCB6E", "#E17055", "#DDA0DD"]

# 输出设置
output:
  # 默认输出目录
  default_directories:
    results: "results"
    plots: "plots"
    exports: "exports"
    temp: "temp"
  
  # 文件命名规则
  naming:
    timestamp_format: "%Y%m%d_%H%M%S"
    include_run_id: true
    prefix: "beam_analysis"
  
  # 导出格式
  export_formats:
    data: ["parquet", "csv", "xlsx"]
    plots: ["png", "pdf", "svg"]
    reports: ["html", "pdf"]

# 性能设置
performance:
  # 并行处理
  parallel:
    enabled: true
    max_workers: 4
    chunk_size: 100
  
  # 内存管理
  memory:
    max_cache_size: "1GB"
    gc_frequency: 100
    enable_monitoring: true
  
  # 进度显示
  progress:
    enabled: true
    style: "rich"  # 可选: "rich", "tqdm", "simple"
    update_interval: 0.1