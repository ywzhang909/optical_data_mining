[project]
name = "data-miner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "nbformat>=5.10.4",
    "numpy>=2.3.0",
    "opencv-contrib-python>=4.11.0.86",
    "opencv-python>=4.11.0.86",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "pydantic==2.4.2",
    "pytest==7.4.3",
    "pygwalker>=0.4.9.15",
    "pymysql",
    "scikit-learn>=1.7.0",
    "tqdm>=4.67.1",
    "uvicorn==0.24.0",
    "zernike>=0.0.33",
    "singleton-decorator>=1.0.0",
    "nbstripout>=0.8.2",
    "swanlab>=0.7.5",
    "swifter>=1.4.0",
    "statsmodels>=0.14.6",
    "runcell>=0.1.14",
    "scikit-image>=0.26.0",
    "statsmodels>=0.14.6",
    "sqlalchemy>=2.0.45",
    "dotenv>=0.9.9",
    "ryven>=3.5.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# UV 工具配置
[tool.uv]
# 设置缓存目录在项目内，避免跨文件系统问题
cache-dir = ".uv/cache"
# 设置链接模式为copy，避免硬链接警告
link-mode = "copy"
# 设置Python下载目录
python-downloads = ".uv/python"
# 启用并发下载
concurrency = 4
# 优先使用二进制包
prefer-binary = true
# 禁用哈希要求以提高兼容性
require-hashes = false